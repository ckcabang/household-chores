{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Household Chores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chores/css/main.css' %}">
  <script src="{% static 'chores/vendor/htmx-2.0.4.min.js' %}" defer></script>
  <script src="{% static 'chores/vendor/alpinejs-3.14.9.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="{% url 'chores:home' %}">Household Chores</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{% url 'chores:home' %}">Home</a>
        {# Dashboard, Chores, and Setup links are added by their own tasks. #}
      </nav>
    </div>
  </header>

  <main class="container site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      A fair-share chore planner for two-person households.
    </div>
  </footer>
</body>
</html>
