{% extends "chores/base.html" %}

{% block title %}Create a household · Household Chores{% endblock %}

{% block content %}
  <h1>Create a household</h1>
  <p>Give your household a name. You'll be its first member.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create household</button>
  </form>
{% endblock %}
