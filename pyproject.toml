[project]
name = "household-chores"
version = "0.1.0"
description = "An app for two-person households to plan, assign, and balance recurring chores fairly."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69,<1.0",
    "django>=5.1,<5.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
